services:
  - type: web
    name: ai-video-creator
    env: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y imagemagick ffmpeg
      pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
